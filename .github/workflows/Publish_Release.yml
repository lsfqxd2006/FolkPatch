- name: 从 APK 文件名读取版本信息
  id: version
  run: |
    VERSION_NAME=""
    VERSION_CODE=""
    
    for apk in artifacts/*.apk; do
      if [ -f "$apk" ]; then
        filename=$(basename "$apk")
        if [[ "$filename" =~ FolkPatch-(Debug|Release)-([0-9.]+)-([0-9]+)\.apk$ ]]; then
          VERSION_NAME="${BASH_REMATCH[2]}"
          VERSION_CODE="${BASH_REMATCH[3]}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "✓ 从 APK 文件名读取到版本名: ${VERSION_NAME}"
          echo "✓ 从 APK 文件名读取到版本号: ${VERSION_CODE}"
          echo "✓ 使用的 APK: ${filename}"
          break
        fi
      fi
    done
    
    # 检查是否成功读取到版本信息
    if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
      echo "::error::无法从 APK 文件名解析版本信息！"
      echo "::error::APK 文件名格式应为: FolkPatch-类型-版本名-版本号.apk"
      echo "::error::实际文件列表:"
      ls -la artifacts/ || echo "无文件"
      exit 1
    fi