name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (leave empty to auto-detect from code)'
        required: false
        type: string
        default: ''
      build_run_id:
        description: 'Build run ID (leave empty to use latest successful build)'
        required: false
        type: string
        default: ''
      build_type:
        description: 'Build type to publish'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

permissions:
  contents: write

jobs:
  publish:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'return\s+"\K[^"]+' build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(grep -A2 'fun getVersionName()' build.gradle.kts | grep -oP 'return\s+"\K[^"]+' | head -1)
          fi
          VERSION_CODE=$(grep -oP 'return\s+\K\d+' build.gradle.kts | head -1)
          
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          
          echo "✓ Auto-detected version: ${VERSION_NAME} (code: ${VERSION_CODE})"

      - name: Determine final version name
        id: final_version
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            VERSION="${{ inputs.version_name }}"
            echo "✓ Using manual version: ${VERSION}"
          else
            VERSION="${{ steps.version.outputs.version_name }}"
            echo "✓ Using auto-detected version: ${VERSION}"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Find build workflow run
        id: find_build
        run: |
          if [ -n "${{ inputs.build_run_id }}" ]; then
            RUN_ID="${{ inputs.build_run_id }}"
            echo "✓ Using specified build run ID: ${RUN_ID}"
          else
            RUN_ID=$(gh run list --workflow build.yml --status success --json databaseId --jq '.[0].databaseId' --limit 1)
            if [ -z "$RUN_ID" ]; then
              echo "::error::No successful build found!"
              exit 1
            fi
            echo "✓ Using latest build run ID: ${RUN_ID}"
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Download release artifacts
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: actions/download-artifact@v4
        with:
          pattern: folkpatch-release-*
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find_build.outputs.run_id }}
          merge-multiple: true
        continue-on-error: true

      - name: Download debug artifacts
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        uses: actions/download-artifact@v4
        with:
          pattern: folkpatch-debug-*
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find_build.outputs.run_id }}
          merge-multiple: true
        continue-on-error: true

      - name: Verify downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          if [ -d "artifacts" ] && [ -n "$(ls -A artifacts 2>/dev/null)" ]; then
            ls -la artifacts/
            FILE_COUNT=$(ls -1 artifacts/*.apk 2>/dev/null | wc -l)
            echo "✓ Found ${FILE_COUNT} APK file(s)"
          else
            echo "::error::No artifacts downloaded!"
            exit 1
          fi

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="FolkPatch-${{ steps.final_version.outputs.name }}-${{ steps.version.outputs.version_code }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠ Tag $TAG already exists, will update existing release"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Tag $TAG does not exist, will create new release"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.check_tag.outputs.tag }}" -m "Release version ${{ steps.final_version.outputs.name }} (code: ${{ steps.version.outputs.version_code }})"
          git push origin "${{ steps.check_tag.outputs.tag }}"
          echo "✓ Git tag created and pushed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.check_tag.outputs.tag }}
          name: FolkPatch ${{ steps.final_version.outputs.name }} (${{ steps.version.outputs.version_code }})
          body: |
            ## 🎉 FolkPatch Release ${{ steps.final_version.outputs.name }}
            
            ### 📦 Build Information
            | 项目 | 值 |
            |------|-----|
            | 版本名 | `${{ steps.final_version.outputs.name }}` |
            | 版本号 | `${{ steps.version.outputs.version_code }}` |
            | 构建类型 | `${{ inputs.build_type }}` |
            | 源构建 | [#${{ steps.find_build.outputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find_build.outputs.run_id }}) |
            
            ### 📱 Downloads
            APK files are attached below.
            
            ### 📝 Changelog
            - [View changes](${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.check_tag.outputs.tag }}...HEAD)
            
            ---
            *Automatically published by GitHub Actions*
          draft: false
          prerelease: false
          files: |
            artifacts/*.apk
          
      - name: Publish summary
        run: |
          echo "## ✅ Release Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.check_tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **版本名** | ${{ steps.final_version.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **版本号** | ${{ steps.version.outputs.version_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **构建类型** | ${{ inputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 APK Files" >> $GITHUB_STEP_SUMMARY
          for apk in artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "- \`$(basename "$apk")\`" >> $GITHUB_STEP_SUMMARY
            fi
          done