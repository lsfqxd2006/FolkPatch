name: Publish Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: '构建运行ID（留空则自动使用最新的 build.yml 成功构建）'
        required: false
        type: string
        default: ''
      build_type:
        description: '要发布的构建类型（只上传实际存在的文件）'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 精确查找 build.yml 的最新成功 run
      # 用 REST API 按 workflow 文件名严格过滤，避免 gh run list 的模糊匹配
      # 命中 contracts.yml 之类的其它 workflow
      # ------------------------------------------------------------------
      - name: Find build workflow run
        id: find_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== 仓库所有 workflow（诊断） ==="
          gh workflow list --repo "${{ github.repository }}" || true
          echo "=== 诊断结束 ==="

          if [ -n "${{ inputs.build_run_id }}" ]; then
            RUN_ID="${{ inputs.build_run_id }}"
            echo "✓ 使用指定的构建运行ID: ${RUN_ID}"
          else
            echo "--- 用 REST API 精确查询 build.yml 的最新成功 run ---"
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::没有找到 build.yml 的成功构建记录！请先运行 build.yml"
              exit 1
            fi
            echo "✓ 使用最新的 build.yml 成功运行ID: ${RUN_ID}"
          fi

          echo "--- 目标 run 详细信息（诊断） ---"
          gh run view "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --json workflowName,databaseId,headBranch,event,status,conclusion,displayTitle \
            || true
          echo "--- 信息结束 ---"

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Create artifacts directory
        run: mkdir -p artifacts

      # ------------------------------------------------------------------
      # 用 gh CLI 下载该 run 的全部 artifact
      # 不用 actions/download-artifact 的 pattern，避免跨 run 下载的坑
      # ------------------------------------------------------------------
      - name: Download artifacts via gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          echo "=== 目标 Run ID: ${{ steps.find_build.outputs.run_id }} ==="
          echo "=== 仓库: ${{ github.repository }} ==="

          echo "--- 该 run 的 artifacts 列表（诊断） ---"
          gh api "repos/${{ github.repository }}/actions/runs/${{ steps.find_build.outputs.run_id }}/artifacts" \
            --jq '.artifacts[] | "\(.name) (\(.size_in_bytes) bytes, expired=\(.expired))"' \
            || echo "（API 调用失败）"
          echo "--- 诊断结束 ---"

          echo "--- 开始下载 ---"
          gh run download "${{ steps.find_build.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --dir artifacts
          echo "--- 下载命令结束，exit code=$? ---"

          echo "--- artifacts 目录内容 ---"
          find artifacts -type f | head -50

      # ------------------------------------------------------------------
      # 验证 + 按 build_type 过滤
      # gh run download 会保留 artifact 目录名，需要先把 apk 提到顶层
      # ------------------------------------------------------------------
      - name: 验证下载的构建产物
        run: |
          echo "=== 下载的原始结构 ==="
          find artifacts -type f || true

          # 把散落在子目录里的 apk 提到 artifacts/ 顶层
          find artifacts -mindepth 2 -type f -name "*.apk" -exec mv {} artifacts/ \;
          # 清掉空的 artifact 子目录
          find artifacts -mindepth 1 -type d -empty -delete || true

          echo "=== 收集后的文件列表 ==="
          ls -la artifacts/ || true

          BUILD_TYPE="${{ inputs.build_type }}"
          echo "当前 build_type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "release" ]; then
            find artifacts -maxdepth 1 -name "FolkPatch-Debug_*.apk" -delete
          elif [ "$BUILD_TYPE" = "debug" ]; then
            find artifacts -maxdepth 1 -name "FolkPatch-Release_*.apk" -delete
          fi

          echo "=== 过滤后的文件列表 ==="
          ls -la artifacts/ || true
          FILE_COUNT=$(ls -1 artifacts/*.apk 2>/dev/null | wc -l)
          echo "✓ 找到 ${FILE_COUNT} 个 APK 文件"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::过滤后没有可发布的 APK！"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 从 APK 文件名解析：FolkPatch-<Debug|Release>_<versionCode>_<versionName>.apk
      # ------------------------------------------------------------------
      - name: 从 APK 文件名读取版本信息
        id: version
        run: |
          VERSION_NAME=""
          VERSION_CODE=""

          for apk in artifacts/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              if [[ "$filename" =~ ^FolkPatch-(Debug|Release)_([0-9]+)_([0-9a-fA-F]+)\.apk$ ]]; then
                BUILD_TYPE="${BASH_REMATCH[1]}"
                VERSION_CODE="${BASH_REMATCH[2]}"
                VERSION_NAME="${BASH_REMATCH[3]}"
                echo "✓ 解析到: type=${BUILD_TYPE} code=${VERSION_CODE} name=${VERSION_NAME}"
                echo "✓ 使用的 APK: ${filename}"
                echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
                echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
                if [ "$BUILD_TYPE" = "Release" ]; then
                  break
                fi
              fi
            fi
          done

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::无法从 APK 文件名解析版本信息！"
            echo "::error::APK 文件名格式应为: FolkPatch-Release_<版本号>_<哈希>.apk"
            echo "::error::实际文件列表:"
            ls -la artifacts/ || echo "无文件"
            exit 1
          fi

      - name: 显示实际发布的文件
        run: |
          echo "=== 实际将发布的文件 ==="
          for apk in artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "  📱 $(basename "$apk")"
            fi
          done

      - name: 检查 Tag 是否存在
        id: check_tag
        run: |
          TAG="FolkPatch-Release_${{ steps.version.outputs.version_code }}_${{ steps.version.outputs.version_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠ Tag ${TAG} 已存在，将更新现有发布"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Tag ${TAG} 不存在，将创建新发布"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: 创建 Git Tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.check_tag.outputs.tag }}" \
            -m "FolkPatch-Release ${{ steps.version.outputs.version_code }} ${{ steps.version.outputs.version_name }}"
          git push origin "${{ steps.check_tag.outputs.tag }}"
          echo "✓ Git Tag 已创建并推送"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.check_tag.outputs.tag }}
          name: FolkPatch-Release_${{ steps.version.outputs.version_code }}_${{ steps.version.outputs.version_name }}
          body: |
            ## 🎉 FolkPatch-Release_${{ steps.version.outputs.version_code }}_${{ steps.version.outputs.version_name }}

            ### 📦 构建信息
            | 项目 | 值 |
            |------|-----|
            | 版本号 | `${{ steps.version.outputs.version_code }}` |
            | 版本名 | `${{ steps.version.outputs.version_name }}` |
            | 构建类型 | `${{ inputs.build_type }}` |
            | 源构建 | [#${{ steps.find_build.outputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find_build.outputs.run_id }}) |

            ### 📱 下载
            APK 文件已附在下方。

            ### 📝 更新日志
            - [查看代码变更](${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.check_tag.outputs.tag }}...HEAD)

            ---
            *由 GitHub Actions 自动发布*
          draft: false
          prerelease: false
          files: |
            artifacts/*.apk

      - name: 发布摘要
        run: |
          echo "## ✅ 发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.check_tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **版本号** | ${{ steps.version.outputs.version_code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **版本名** | ${{ steps.version.outputs.version_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **构建类型** | ${{ inputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **源构建** | [#${{ steps.find_build.outputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find_build.outputs.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **实际发布** | $(ls -1 artifacts/*.apk 2>/dev/null | wc -l) 个 APK |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 APK 文件" >> $GITHUB_STEP_SUMMARY
          for apk in artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "- \`$(basename "$apk")\`" >> $GITHUB_STEP_SUMMARY
            fi
          done