name: Setup Build Environment
description: Install all build dependencies (Java, Android SDK, Gradle, Rust toolchain)

runs:
  using: composite
  steps:
    # 强制启用 Node.js 24，消除所有弃用警告
    - name: Enable Node.js 24
      shell: bash
      run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> "$GITHUB_ENV"

    # Java
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    # Android SDK (升级到 v4，支持 Node24)
    - uses: android-actions/setup-android@v4

    # ✅ 极速缓存配置（最稳定、最快）
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: always
        gradle-home-cache-includes: |
          caches
          wrapper

    # Rust 新版官方 action（无 set-output 警告）
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # 安装 cargo-ndk
    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk

    # 授权
    - name: Grant execute permission
      shell: bash
      run: chmod +x gradlew
