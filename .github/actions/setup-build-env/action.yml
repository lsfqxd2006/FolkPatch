name: Setup Build Environment
description: Install all build dependencies (Java, Android SDK, Gradle, Rust toolchain)

runs:
  using: composite
  steps:
    # 1. 强制启用 Node.js 24，消除所有弃用警告
    - name: Enable Node.js 24
      shell: bash
      run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> "$GITHUB_ENV"

    # 2. Java – 升级到 v5，原生支持 Node 24
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    # 3. Android SDK – v4 已支持 Node 24
    - uses: android-actions/setup-android@v4

    # 4. Gradle – 升级到 v5，优化缓存（移除 cache-cleanup: always，提升命中率）
    - uses: gradle/actions/setup-gradle@v5
      with:
        gradle-home-cache-includes: |
          caches
          wrapper
        # 可选：若需要防止非主分支污染缓存，取消下面的注释
        # cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    # 5. Rust 官方 toolchain
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # 6. 新增：Rust 全局缓存（极大加速 cargo install 和编译）
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "folkpatch-rust"

    # 7. 安装 cargo-ndk（命中缓存后瞬间完成）
    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk

    # 8. 授权 gradlew
    - name: Grant execute permission
      shell: bash
      run: chmod +x gradlew